[Service]
# The lingering user manager reaches graphical-session.target before LightDM
# has made the X server and its authority file usable. Keep Dunst in its start
# job until X11 is actually reachable instead of exhausting the D-Bus start
# limit and leaving notification clients initialized without a server.
Environment=DISPLAY=:0
Environment=XAUTHORITY=/run/lightdm/%u/xauthority
ExecStartPre=/bin/bash -c 'until /usr/bin/xdpyinfo -display "$DISPLAY" >/dev/null 2>&1; do /usr/bin/sleep 1; done'
TimeoutStartSec=90

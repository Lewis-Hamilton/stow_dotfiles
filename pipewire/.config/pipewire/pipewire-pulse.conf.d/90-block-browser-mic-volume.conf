# Keep WebRTC automatic gain control inside the browser from rewriting the
# system microphone volume. The user can still adjust source volume normally.
pulse.rules = [
  {
    matches = [
      { application.process.binary = "firefox" }
      { application.process.binary = "chromium" }
      { application.process.binary = "chromium-browser" }
      { application.process.binary = "chrome" }
      { application.process.binary = "google-chrome" }
      { application.process.binary = "google-chrome-stable" }
    ]
    actions = {
      quirks = [ block-source-volume ]
    }
  }
]
